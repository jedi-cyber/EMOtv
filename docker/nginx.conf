# nginx de EMOtv: sirve la SPA compilada y hace proxy de la API y el WebSocket
# al servicio api. El navegador usa rutas relativas del mismo origen.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Algunas rutas existen en la SPA y en la API (/sessions, /students, /users,
# /activities, /analysis). La navegación del navegador pide text/html; las
# llamadas de apiRequest envían Accept: application/json.
map $http_accept $wants_html {
    default      0;
    "~*text/html" 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno de Docker: resuelve "api" en cada petición por si el contenedor cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $emotv_api http://api:8000;

    # MAX_FRAME_BYTES de la API es 2 500 000 bytes; se deja margen.
    client_max_body_size 3m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # X-Forwarded-For se reemplaza (no se agrega) con la IP de la conexión:
    # uvicorn toma la primera IP de la lista y el límite de intentos de login
    # depende de ella. Si se agregara, un cliente podría enviar IPs falsas en
    # cada intento y saltarse el límite. Detrás de Caddy (perfil https) la API
    # ve la IP de Caddy; Docker Desktop tampoco conserva la IP del cliente.

    # WebSocket de análisis: una actividad completa puede durar varios minutos.
    location /ws/ {
        proxy_pass $emotv_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ ^/(auth|sessions|students|users|activities|analysis|expressions|recommendations|consent-policy|consent-policies|chat|health)(/|$) {
        if ($wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass $emotv_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Archivos con hash generados por Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fallback de la SPA.
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        # La SPA solo carga recursos propios; limita el daño de un XSS, que
        # podría leer el token de sessionStorage (docs/security.md).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
