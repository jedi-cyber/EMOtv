[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotv"
version = "0.1.0"
description = "Sistema experimental de análisis emocional y corporal mediante visión por computadora"
requires-python = ">=3.11"

dependencies = [
    "opencv-contrib-python",
    "numpy",
    "psutil",
    "fastapi",
    "uvicorn",
    "websockets",
    "onnxruntime",
    "mediapipe>=0.10.35,<2",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "pwdlib[argon2]>=0.3,<1",
    "PyJWT>=2.10,<3",
    "python-multipart",  # Opcional, pero útil para subir archivos
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "integration: pruebas que requieren servicios externos como PostgreSQL",
]
