# EMOtv con Docker Compose. Guía completa: docs/docker.md
#
#   Sistema completo:   docker compose --env-file .env.docker up -d --build
#                       -> http://localhost:8080
#   Red local (HTTPS):  docker compose --env-file .env.docker --profile https up -d
#                       -> https://<IP>:8443
#   Solo base de datos: docker compose -f docker-compose.yml -f docker-compose.db.yml up -d db
#   Pruebas en Linux:   docker compose --env-file .env.docker --profile test run --rm tests
#                       docker compose --env-file .env.docker --profile test run --rm web-tests
#
# Ningún servicio usa dispositivos de cámara: la cámara se abre en el navegador.

name: emotv

# Se construye para la arquitectura del equipo (verificado en linux/amd64).
# mediapipe, onnxruntime y opencv publican ruedas linux/aarch64; si en Apple
# Silicon algo falla, usa DOCKER_DEFAULT_PLATFORM=linux/amd64 (docs/docker.md).
x-api-image: &api-image
  image: emotv-api:local
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    target: runtime

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER (ver .env.docker.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD (ver .env.docker.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB (ver .env.docker.example)}
    volumes:
      - emotv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin puertos publicados: solo el modo docker-compose.db.yml los expone.

  # Descarga y verifica pesos (SHA-256). Además mide los benchmarks de FER+ y
  # HSEmotion en este equipo si faltan o vencieron: la API solo admite un modelo
  # con un benchmark vigente medido en el mismo entorno (ver docs/docker.md).
  # Si HSEmotion no queda admitido, la lectura en vivo usa FER+.
  models:
    <<: *api-image
    command: ["python", "scripts/download_models.py", "--ensure-benchmark", "/app/models/weights/benchmarks/ferplus.json",
              "--ensure-hsemotion-benchmark", "/app/models/weights/benchmarks/hsemotion.json"]
    restart: "no"
    environment:
      EMOTION_BENCHMARK_MAX_AGE_DAYS: ${EMOTION_BENCHMARK_MAX_AGE_DAYS:-30}
    volumes:
      - emotv_models:/app/models/weights

  api:
    <<: *api-image
    restart: unless-stopped
    # Límites para que el análisis no deje sin CPU ni memoria a db ni a web.
    # Valores iniciales pensados para el equipo mínimo (4 núcleos, 4 GB).
    cpus: ${API_CPUS:-3}
    mem_limit: ${API_MEMORY_LIMIT:-2560m}
    depends_on:
      db:
        condition: service_healthy
      models:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CONSENT_MODE: ${CONSENT_MODE:-demo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      ALLOWED_ADMIN_RESET_HOSTS: ${ALLOWED_ADMIN_RESET_HOSTS:-db}
      # Plazo de las cuentas de voluntarios (scripts/testdata/delete_test_data.py --expired).
      TEST_DATA_RETENTION_DAYS: ${TEST_DATA_RETENTION_DAYS:-30}
      # Privacidad: cifrado de campos sensibles, cuentas de administrador y retención.
      # BACKUP_KEY no se pasa a la API: la usan solo los scripts de respaldo.
      SENSITIVE_DATA_KEY: ${SENSITIVE_DATA_KEY:-}
      MAX_ADMIN_ACCOUNTS: ${MAX_ADMIN_ACCOUNTS:-1}
      PARTICIPANT_RETENTION_MONTHS: ${PARTICIPANT_RETENTION_MONTHS:-12}
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-24}
      # Emi (workflow de n8n Cloud). Sin N8N_WEBHOOK_KEY el chat responde 503.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://emotv.app.n8n.cloud/webhook/emi-chat}
      N8N_WEBHOOK_KEY: ${N8N_WEBHOOK_KEY:-}
      N8N_TIMEOUT_SECONDS: ${N8N_TIMEOUT_SECONDS:-30}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-10}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-90}
      CHAT_LIMIT_WINDOW_MESSAGES: ${CHAT_LIMIT_WINDOW_MESSAGES:-20}
      CHAT_LIMIT_WINDOW_MINUTES: ${CHAT_LIMIT_WINDOW_MINUTES:-10}
      CHAT_LIMIT_DAILY_MESSAGES: ${CHAT_LIMIT_DAILY_MESSAGES:-200}
      CHAT_MAX_QUESTION_CHARS: ${CHAT_MAX_QUESTION_CHARS:-1000}
      CHAT_RISK_MESSAGE: ${CHAT_RISK_MESSAGE:-}
      # httpx usa certifi; este almacén incluye las CA de docker/certs/.
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      FERPLUS_BENCHMARK_PATH: /app/models/weights/benchmarks/ferplus.json
      HSEMOTION_BENCHMARK_PATH: /app/models/weights/benchmarks/hsemotion.json
      EMOTION_BENCHMARK_MAX_AGE_DAYS: ${EMOTION_BENCHMARK_MAX_AGE_DAYS:-30}
      LOGIN_MAX_FAILURES_PER_ACCOUNT: ${LOGIN_MAX_FAILURES_PER_ACCOUNT:-5}
      LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-20}
      LOGIN_ATTEMPT_WINDOW_MINUTES: ${LOGIN_ATTEMPT_WINDOW_MINUTES:-15}
      LIVE_STABLE_SECONDS: ${LIVE_STABLE_SECONDS:-1}
      LIVE_MIN_CONFIDENCE: ${LIVE_MIN_CONFIDENCE:-0.5}
      LIVE_CALIBRATION_MIN_INCREASE: ${LIVE_CALIBRATION_MIN_INCREASE:-0.10}
      # Protección de carga. Dentro de Docker, os.cpu_count ve los núcleos del
      # equipo y no API_CPUS: MAX_CONCURRENT_ANALYSES se fija aquí (API_CPUS - 1).
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-2}
      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-4}
      ANALYSIS_BUSY_WAIT_SECONDS: ${ANALYSIS_BUSY_WAIT_SECONDS:-5}
      LIVE_IDLE_TIMEOUT_SECONDS: ${LIVE_IDLE_TIMEOUT_SECONDS:-60}
      ONNX_THREADS_PER_SESSION: ${ONNX_THREADS_PER_SESSION:-1}
    volumes:
      - emotv_models:/app/models/weights:ro
    # Sin puertos publicados: se accede a través de web.

  web:
    image: emotv-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8080:8080"

  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      EMOTV_LAN_HOST: ${EMOTV_LAN_HOST:-localhost}
    ports:
      - "8443:8443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - emotv_caddy_data:/data
      - emotv_caddy_config:/config

  # --- Perfil "test": no arranca con "up"; solo con --profile test ---
  # Las pruebas corren dentro de Linux, así los procesos no dependen del
  # antivirus del anfitrión (p. ej. la contención de Comodo en Windows).
  # Base desechable en memoria, sin puertos publicados ni datos reales.
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: emotv_pruebas
      POSTGRES_DB: emotv_pruebas
      # Solo accesible dentro de la red de Compose y sin datos: sin contraseña.
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotv_pruebas -d emotv_pruebas"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Backend: migraciones sobre test-db y luego python -m pytest -q.
  # Argumentos extra: ... run --rm tests python -m pytest -q tests/unit
  tests:
    image: emotv-tests:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: tests
    profiles: ["test"]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://emotv_pruebas@test-db:5432/emotv_pruebas
    working_dir: /app
    volumes:
      - .:/app
    entrypoint: ["sh", "-c", "python -m alembic upgrade head >/dev/null && exec \"$$@\"", "--"]
    command: ["python", "-m", "pytest", "-q"]

  # Frontend: npx tsc -b y npx vitest run. node_modules vive en un volumen
  # propio con binarios de Linux; nunca se mezcla con el de Windows.
  web-tests:
    # jsdom 30 (vitest) exige Node 22.22.2+ o 24.15+; el anfitrión usa Node 24.
    image: node:24-alpine
    profiles: ["test"]
    working_dir: /web
    volumes:
      - ./web:/web
      - emotv_web_test_node_modules:/web/node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx tsc -b && npx vitest run"]

volumes:
  emotv_pgdata:
    name: emotv_pgdata
  emotv_models:
    name: emotv_models
  emotv_caddy_data:
    name: emotv_caddy_data
  emotv_caddy_config:
    name: emotv_caddy_config
  emotv_web_test_node_modules:
    name: emotv_web_test_node_modules
