name: Pruebas

on:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    services:
      # Base de datos desechable solo para esta ejecución (sin contraseña, solo accesible desde el runner).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emotv_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emotv_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/emotv_test
      ENVIRONMENT: development
      CONSENT_MODE: demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias del sistema (OpenCV, MediaPipe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libegl1 libgles2
      - name: Instalar el proyecto
        run: python -m pip install -e ".[dev]"
      - name: Clave JWT efímera
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET_KEY=$secret" >> "$GITHUB_ENV"
      - name: Migraciones
        run: python -m alembic upgrade head
      # Sin pesos de modelos: esas pruebas se saltan (CLAUDE.md).
      - name: pytest
        run: python -m pytest -q

  frontend:
    name: tsc y vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
