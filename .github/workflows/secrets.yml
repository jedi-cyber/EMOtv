name: Detector de secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar todos los archivos versionados
        run: python scripts/security/check_secrets.py --all
