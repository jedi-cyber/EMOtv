name: Pruebas e2e

# Solo ejecución manual: levanta el stack completo con Docker, descarga los
# pesos y mide el benchmark de FER+, así que tarda bastante más que las pruebas
# de cada push. Emi usa el n8n falso de las pruebas, nunca el workflow publicado.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configuración efímera del stack
        run: |
          postgres_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$jwt_secret"
          {
            echo "POSTGRES_USER=emotv"
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "POSTGRES_DB=emotv"
            echo "DATABASE_URL=postgresql+psycopg://emotv:$postgres_password@db:5432/emotv"
            echo "JWT_SECRET_KEY=$jwt_secret"
            echo "ENVIRONMENT=development"
            echo "CONSENT_MODE=demo"
          } > .env.e2e
      - name: Dependencias de Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Sin imágenes de rostro en el repositorio: solo el tramo sin persona.
      # Las pruebas de análisis que necesitan un rostro se marcan como omitidas.
      - name: Video de la cámara simulada
        run: |
          python -m pip install opencv-python-headless numpy
          python scripts/e2e/make_fake_video.py --empty-only
      - name: Pruebas e2e contra el stack aislado
        env:
          E2E_ENV_FILE: .env.e2e
        run: bash scripts/e2e/run_isolated.sh
      - name: Registros del stack si falla
        if: failure()
        run: docker compose -p emotv-e2e --env-file .env.e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color api web | tail -200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
